<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kafka Messages</title>
    <style>
        body {
            /* background: radial-gradient(#0202a8, #0000fb); */
            background: black;
            color: #fff;
            background-size: cover;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
        }

        nav {
            height: 7vh;
        }

        main {
            width: 100%;
            height: 90vh;
            display: flex;
        }

        .nav_logo {
            height: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.75vw;
            color: yellow;
        }

        .nav_logo>img {
            height: 70%;
            padding: 0.5vw;
        }

        .navlower {
            /* height: 50%; */
            font-size: 3vw;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .navlower>img {
            height: 6vw;
            padding: 0 6vw;
        }

        table {
            height: 100%;
            width: 100%;
        }

        tbody#rows {
            width: 100%;
            height: 100%;
        }

        .error,
        .success {
            margin: auto;
            font-size: 6vh;
            text-align: center;
        }

        .error {
            color: #ff0000;
        }

        .success {
            color: #00ff00;
        }

        footer>img {
            height: 90%;
            margin: auto auto auto 10px;
        }

        #disclaimer {
            display: none;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* grid-template-rows: repeat(2, auto); */
            grid-auto-rows: 45vh;
            /* gap: 2vh 2vw; */
            justify-items: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: flex;
        }

        .grid-item img {
            height: 35vh;
            border-radius: 5%;
            border: 0.5vh solid rgb(102, 255, 0);
        }

        .grid-item span {
            font-size: 4vh;
            /* margin-top: 1vh; */
            text-align: center;
        }

        .heading {
            font-size: 78px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo {
            width: 300px;
            margin: 20px 0;
            animation: fadeInZoom 3s ease-in-out infinite;
        }

        @keyframes fadeInZoom {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(2.5);
            }

            50% {
                opacity: 1;
                transform: scale(4);
            }
        }

        .instruction {
            font-size: 50px;
            font-weight: bold;
            color: #ccc;
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 5;
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: absolute;
            bottom: 0;
            background-color: #00ff00;
            padding: 15px 0;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 10s linear infinite;
            color: #000;
            font-size: 40px;
            font-weight: bold;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(-100%);
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>

<body>
    <nav>
        <div class="navlower">PLEASE LOOK INTO THE CAMERA</div>
    </nav>
    <div id="fallback-template"
        style="text-align: center; color: white; height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <img src="static/img/abesit.png" alt="ABESIT Logo" class="logo" />
        <div class="instruction" style="font-size: 4vh; margin-top: 2vh;">
            Stand in front of the camera to begin verification
        </div>
        <div class="marquee-container" style="overflow: hidden; white-space: nowrap; width: 100%; margin-top: 2vh;">
            <div class="marquee-text"
                style="display: inline-block; animation: marquee 10s linear infinite; font-size: 3vh;">
                Camera Active – Waiting for Student...
            </div>
        </div>
    </div>
    <main id="main">
        <table>
            <tbody id="rows"></tbody>
        </table>

    </main>

    <!-- <footer>
        <img src="{{ url_for('static', filename='img/nvidia-logo.png') }}" alt="">
    </footer> -->

    <script type="text/javascript">
        const socket = io.connect('http://' + document.domain + ':' + location.port);
        let lastUpdate = Date.now();
        const clearIntervalTime = 15000;
        let errorMessage = '';
        let successMessage = '';
        let isErrorPersisted = false;
        let isSuccessPersisted = false;

        socket.on('connect', function () { });

        socket.on('new_message', function (data) {
            const errorMessages = data.message.filter(item => item.hasOwnProperty('ERROR'));
            const successMessages = data.message.filter(item => item.hasOwnProperty('SUCCESS'));

            if (errorMessages.length > 0) {
                errorMessage = errorMessages[0].ERROR;
                isErrorPersisted = true;
                isSuccessPersisted = false;
                successMessage = '';
            } else if (successMessages.length > 0) {
                successMessage = successMessages[0].SUCCESS;
                isSuccessPersisted = true;
                isErrorPersisted = false;
                errorMessage = '';
                if (successMessage === "✅ Facial Recognition Attendance System is Getting Started. Please Wait for 2 Minutes ✅") {
                    setTimeout(() => { isSuccessPersisted = false; }, 120000);
                } else {
                    setTimeout(() => { isSuccessPersisted = false; }, 5000);
                }
            } else if (data.message.length > 0) {
                isErrorPersisted = false;
                errorMessage = '';
            }

            if (isErrorPersisted) {
                updateMessage([{ 'ERROR': errorMessage }], 'error');
            } else if (isSuccessPersisted) {
                updateMessage([{ 'SUCCESS': successMessage }], 'success');
            } else {
                updateMessage(data.message, 'normal');
            }

            lastUpdate = Date.now();
        });

        function updateMessage(message, messageType) {
            const container = document.getElementById('rows');
            const main = document.getElementById('main');
            const fallback = document.getElementById('fallback-template');

            container.innerHTML = '';

            if (messageType === 'error' || messageType === 'success') {
                fallback.style.display = 'none';
                main.style.display = 'block';
                const rowElement = document.createElement('tr');
                rowElement.className = 'row';

                const key = Object.keys(message[0])[0];
                const value = message[0][key];

                const labelCell = document.createElement('td');
                const textElement = document.createElement('span');
                labelCell.colSpan = 2;

                if (key === 'ERROR') {
                    labelCell.classList.add('error');
                    textElement.textContent = value;
                    labelCell.appendChild(textElement);
                } else if (key === 'SUCCESS') {
                    labelCell.classList.add('success');
                    textElement.textContent = value;
                    labelCell.appendChild(textElement);
                }

                rowElement.appendChild(labelCell);
                container.appendChild(rowElement);
            } else if (message.length === 0) {
                fallback.style.display = 'flex';
                main.style.display = 'none';
            } else {
                console.log(message);
                fallback.style.display = 'none';
                main.style.display = 'block';
                const gridContainer = document.createElement('div');
                gridContainer.className = 'grid-container';

                message.slice(0, 6).forEach(item => {
                    const key = Object.keys(item)[0];
                    const value = item[key];

                    const gridItem = document.createElement('div');
                    gridItem.className = 'grid-item';

                    const img = document.createElement('img');
                    img.src = "data:image/jpg;base64," + value;

                    const label = document.createElement('span');
                    label.classList.add('normal');
                    label.textContent = key;

                    gridItem.appendChild(img);
                    gridItem.appendChild(label);
                    gridContainer.appendChild(gridItem);
                });

                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 3;
                cell.appendChild(gridContainer);
                row.appendChild(cell);
                container.appendChild(row);
            }
        }

        setInterval(function () {
            socket.emit('check_updates');
        }, 100);

        setInterval(function () {
            if (!isErrorPersisted && !isSuccessPersisted && Date.now() - lastUpdate > clearIntervalTime) {
                updateMessage([], 'normal');
            }
        }, 1000);
    </script>

    <script id="json-data" type="application/json">{{ message|tojson }}</script>
</body>

</html>
